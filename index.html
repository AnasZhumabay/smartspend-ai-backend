<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartSpend Pro</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #081225, #0b1f34, #111827);
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 760px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 24px;
      padding: 32px;
      box-sizing: border-box;
      backdrop-filter: blur(10px);
    }
    h1 {
      margin-top: 0;
      font-size: 42px;
    }
    p {
      color: rgba(255,255,255,0.8);
      line-height: 1.7;
    }
    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 24px;
    }
    a.button {
      text-decoration: none;
      color: white;
      padding: 14px 20px;
      border-radius: 14px;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.12);
      display: inline-block;
    }
    a.button.primary {
      background: linear-gradient(90deg, #34d399, #3b82f6);
      border: none;
    }
    .footer {
      margin-top: 28px;
      font-size: 14px;
      color: rgba(255,255,255,0.55);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>SmartSpend Pro</h1>
    <p>
      SmartSpend Pro is a personal finance app designed to help users track spending,
      understand financial patterns, and access AI-based financial guidance in a clean premium experience.
    </p>

    <div class="buttons">
      <a class="button primary" href="./privacy.html">Privacy Policy</a>
      <a class="button" href="./support.html">Support</a>
    </div>

    <div class="footer">
      © 2026 SmartSpend Pro
    </div>
  </div>
</body>
</html>
